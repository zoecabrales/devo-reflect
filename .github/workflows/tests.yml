# Runs the type check, unit tests and Firestore rules tests on every push to
# dev or release and on pull requests. A ✕ on GitHub means something broke.
# Lint isn't run here yet because the code has existing lint errors.
name: Tests

on:
  push:
    branches: [dev, release]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The Firestore emulator runs on Java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Firestore rules tests
        run: |
          npm install -g firebase-tools@15
          npm run test:rules
