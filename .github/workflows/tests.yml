# Runs the type check, lint, unit tests and Firestore rules tests on every
# push to dev or release and on pull requests. A ✕ on GitHub means something
# broke.
name: Tests

on:
  push:
    branches: [dev, release]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The Firestore emulator runs on Java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      # Expo writes this file on `expo start` and it isn't committed; it
      # loads Expo's types (e.g. `hovered` on web Pressables)
      - name: Type check
        run: |
          echo '/// <reference types="expo/types" />' > expo-env.d.ts
          npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Firestore rules tests
        run: |
          npm install -g firebase-tools@15
          npm run test:rules
