# Sends the daily reading reminders: every 15 minutes, asks the website's
# /api/cron/reminders to send any that are due. Needs:
#   - repository variable SITE_URL   e.g. https://devo-reflect.vercel.app
#   - repository secret   CRON_SECRET (the same value as in Vercel)
# GitHub may start scheduled runs a few minutes late; the server catches up
# on anything due within the last hour. It can also be run by hand from the
# Actions tab ("Run workflow").
name: Daily reminders

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send due reminders
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "SITE_URL or CRON_SECRET is not set; skipping."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cron/reminders"
